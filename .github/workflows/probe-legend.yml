name: Probe EFFIS WMS legends

on:
  pull_request:
    paths:
      - ".github/workflows/probe-legend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GetLegendGraphic for each layer and dump as base64
        run: |
          leg () {
            name="$1"; layer="$2"
            url="https://maps.effis.emergency.copernicus.eu/effis?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetLegendGraphic&LAYER=${layer}&FORMAT=image%2Fpng"
            out=$(curl -sS -m 40 -o "${name}.png" -w "%{http_code} %{size_download}B %{content_type}" "$url" || echo "curl-error")
            echo "=== ${name}: ${out}"
            if file "${name}.png" | grep -q "PNG"; then
              echo "--B64START ${name}"
              base64 -w 200 "${name}.png"
              echo "--B64END ${name}"
            else
              cat "${name}.png"; echo
            fi
          }
          leg all-hs "all.hs"
          leg viirs-hs "viirs.hs"
          leg modis-hs "modis.hs"
          leg noaa-hs "noaa.hs"
          leg ba-season "modis.ba.season"
