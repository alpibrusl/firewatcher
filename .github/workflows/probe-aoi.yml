name: Probe EFFIS AOI statistics

on:
  pull_request:
    paths:
      - ".github/workflows/probe-aoi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test cprof host
        run: |
          try () {
            echo "================ $1"
            curl -sS -m 25 -H "Origin: https://alpibrusl.github.io" -D headers.txt "$1" -o out.json 2>/dev/null || { echo "curl error"; return; }
            grep -i "access-control-allow-origin" headers.txt || echo "(no CORS header)"
            echo "size=$(wc -c < out.json)"
            head -c 1600 out.json; echo
            echo "---- tail:"; tail -c 400 out.json; echo
          }
          c="https://cprof.effis.emergency.copernicus.eu/api/v3"
          try "$c/subcountries?admin0=ESP&env=PROD"
          try "$c/banf?level=ADM0&value=ESP&year=2026&yearFrom=2006&yearTo=2026&env=PROD"
          try "$c/banf?level=ADM1&value=ESP.1_1&year=2026&yearFrom=2006&yearTo=2026&env=PROD"
          try "$c/banf?level=admin1&value=ESP.1_1&year=2026&yearFrom=2006&yearTo=2026&env=PROD"
