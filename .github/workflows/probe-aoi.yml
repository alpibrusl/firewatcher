name: Probe EFFIS AOI statistics

on:
  pull_request:
    paths:
      - ".github/workflows/probe-aoi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract API endpoints from the GWIS country-profile app
        run: |
          base="https://gwis.jrc.ec.europa.eu"
          curl -sSL -m 30 "$base/apps/country.profile/overview/ADM0/ESP" -o page.html || true
          echo "--- page size: $(wc -c < page.html)"
          for s in $(grep -oE 'src="[^"]+\.js[^"]*"' page.html | sed 's/^src="//;s/"$//' | head -8); do
            case "$s" in http*) u="$s" ;; /*) u="$base$s" ;; *) u="$base/apps/country.profile/$s" ;; esac
            curl -sS -m 30 "$u" -o bundle.js || continue
            echo "=== $u ($(wc -c < bundle.js) bytes)"
            grep -oE '["'"'"'][^"'"'"']*(api|/statistics/|adm|gadm|admin)[^"'"'"']{0,90}["'"'"']' bundle.js | grep -iE 'http|/api|adm|stat' | sort -u | head -50 || true
            echo
          done

      - name: Test discovered admin-level endpoints
        run: |
          try () {
            echo "================ $1"
            curl -sS -m 20 "$1" -o out.json 2>/dev/null || { echo "curl error"; return; }
            echo "size=$(wc -c < out.json)"
            head -c 900 out.json; echo
          }
          api="https://api2.effis.emergency.copernicus.eu"
          try "$api/statistics/v2/gwis/weekly?country=ESP"
          try "$api/api/cp/adm1/ESP"
          try "$api/api/countryprofile/adm1/ESP"
          try "https://gwis.jrc.ec.europa.eu/api/country.profile/adm1/ESP"
