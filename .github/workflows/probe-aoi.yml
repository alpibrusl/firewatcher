name: Probe EFFIS AOI statistics

on:
  pull_request:
    paths:
      - ".github/workflows/probe-aoi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract exact banf/subcountries URL construction
        run: |
          curl -sS -m 30 "https://gwis.jrc.ec.europa.eu/apps/country.profile/_nuxt/93bcba8.js" -o bundle.js || true
          grep -oE '.{160}/api/v3/banf.{160}' bundle.js | head -5 || true
          echo
          grep -oE '.{80}/api/v3/subcountries.{120}' bundle.js | head -5 || true

      - name: Test v3 endpoints with CORS check
        run: |
          try () {
            echo "================ $1"
            curl -sS -m 20 -H "Origin: https://alpibrusl.github.io" -D headers.txt "$1" -o out.json 2>/dev/null || { echo "curl error"; return; }
            grep -i "access-control-allow-origin" headers.txt || echo "(no CORS header)"
            echo "size=$(wc -c < out.json)"
            head -c 900 out.json; echo
          }
          g="https://gwis.jrc.ec.europa.eu/api/v3"
          try "$g/subcountries?admin0=ESP"
          try "$g/banf?level=admin0&value=ESP&yearFrom=2020&yearTo=2026"
          try "$g/banf?level=admin1&value=ESP&yearFrom=2020&yearTo=2026"
          try "$g/banf?level=admin1&value=ESP.1_1&yearFrom=2020&yearTo=2026"
          try "$g/banf?level=admin0&value=ESP"
