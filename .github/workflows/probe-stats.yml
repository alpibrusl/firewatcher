name: Probe EFFIS stats API

on:
  pull_request:
    paths:
      - ".github/workflows/probe-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the weekly statistics endpoints
        run: |
          api="https://api2.effis.emergency.copernicus.eu/statistics/v2"
          for url in \
            "$api/effis/weekly?country=ESP" \
            "$api/ta/weekly?country=ESP" ; do
            echo "================ ${url}"
            curl -sS -m 30 -H "Origin: https://alpibrusl.github.io" -D - "$url" 2>&1 | head -c 6000 || true
            echo
            echo "---- tail of body:"
            curl -sS -m 30 "$url" 2>/dev/null | tail -c 1500 || true
            echo
            echo
          done
