name: ETL data snapshots

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl.py"
      - ".github/workflows/etl.yml"

permissions:
  contents: write

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch snapshots
        run: python scripts/etl.py
      - name: Commit and push if changed
        run: |
          git config user.name "firewatcher-etl"
          git config user.email "noreply@github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "ETL: refresh data snapshots"
            # The branch may have moved while snapshots were downloading.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
