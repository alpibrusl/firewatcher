name: ETL data snapshots

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl.py"
      - "scripts/train_model.py"
      - ".github/workflows/etl.yml"

permissions:
  contents: write

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync to branch tip
        # Push-event runs pin to their trigger commit; queued runs must see
        # the latest code AND data (incremental climate depends on it).
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch snapshots
        run: python scripts/etl.py
      - name: Train season-outlook models
        # Non-fatal: a training failure must not discard the fetched snapshots.
        run: |
          pip install --quiet numpy scikit-learn
          if [ -f app/data/climate-regions-esp.json ]; then
            python scripts/train_model.py || echo "WARN training failed; committing data anyway"
          else
            echo "no regional climate yet; skipping training"
          fi
      - name: Commit and push if changed
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "ETL: refresh data snapshots"
            # The branch may have moved while snapshots were downloading;
            # on conflicting data files the freshly fetched version wins.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
