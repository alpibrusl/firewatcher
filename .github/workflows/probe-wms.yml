name: Probe EFFIS WMS layers

on:
  pull_request:
    paths:
      - ".github/workflows/probe-wms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Blank-tile hash comparison
        run: |
          wms="https://maps.effis.emergency.copernicus.eu/effis"
          today=$(date -u +%Y-%m-%d)
          yday=$(date -u -d "yesterday" +%Y-%m-%d)
          spain="-779236.0,4721671.0,-222638.0,5165920.0"
          ocean="-2500000.0,3000000.0,-1943402.0,3444249.0"
          t () {
            name="$1"; layer="$2"; bbox="$3"; time="$4"
            url="$wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${layer}&STYLES=&FORMAT=image/png&TRANSPARENT=true&SRS=EPSG:3857&BBOX=${bbox}&WIDTH=512&HEIGHT=512"
            [ -n "$time" ] && url="${url}&TIME=${time}"
            curl -sS -m 25 "$url" -o out.bin 2>/dev/null || { echo "$name -> curl error/timeout"; return; }
            echo "$name -> $(wc -c < out.bin) bytes md5=$(md5sum out.bin | cut -c1-12) $(file -b out.bin | cut -c1-40)"
          }
          t "BLANK-BASELINE all.hs ocean today" "all.hs" "$ocean" "$today"
          t "all.hs spain today"                "all.hs" "$spain" "$today"
          t "all.hs spain range"                "all.hs" "$spain" "$yday/$today"
          t "all.hs spain no-time"              "all.hs" "$spain" ""
          t "viirs.hs spain no-time"            "viirs.hs" "$spain" ""
          t "viirs.hs spain yday"               "viirs.hs" "$spain" "$yday"
          t "mf010.fwi spain today"             "mf010.fwi" "$spain" "$today"
          t "mf010.fwi spain no-time"           "mf010.fwi" "$spain" ""
          t "effis.nrt.ba.poly spain no-time"   "effis.nrt.ba.poly" "$spain" ""
          t "modis.ba.season spain no-time"     "modis.ba.season" "$spain" ""

