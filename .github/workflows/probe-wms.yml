name: Probe EFFIS WMS tile options

on:
  pull_request:
    paths:
      - ".github/workflows/probe-wms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Detection layers 256 vs 512, cold renders on fresh bboxes
        run: |
          getmap () {
            name="$1"; layers="$2"; size="$3"; bbox="$4"
            url="https://maps.effis.emergency.copernicus.eu/effis?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${layers}&STYLES=&SRS=EPSG%3A3857&BBOX=${bbox}&WIDTH=${size}&HEIGHT=${size}&FORMAT=image%2Fpng&TRANSPARENT=TRUE"
            out=$(curl -sS -m 90 -o "${name}.png" -w "%{http_code} %{time_total}s %{size_download}B %{content_type}" "$url" || echo "curl-error")
            echo "${name}: ${out}"
          }
          # Fresh bboxes never requested by earlier rounds (E and SE Spain)
          E1="0,4383204.95,313086.07,4696291.02"
          E2="-313086.07,4539747.98,0,4852834.06"
          SE1="-313086.07,4383204.95,0,4539747.98"
          SE2="-469629.10,4470876.47,-313086.07,4627419.50"
          echo "==== combined detection cold, 512 vs 256"
          getmap combo512-e1 "modis.ba.season,all.hs" 512 "$E1"
          getmap combo256-e2 "modis.ba.season,all.hs" 256 "$E2"
          getmap combo512-se1 "modis.ba.season,all.hs" 512 "$SE1"
          getmap combo256-se2 "modis.ba.season,all.hs" 256 "$SE2"
          echo "==== warm repeats"
          getmap combo512-e1b "modis.ba.season,all.hs" 512 "$E1"
          getmap combo256-e2b "modis.ba.season,all.hs" 256 "$E2"
