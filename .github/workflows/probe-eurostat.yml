name: Probe Eurostat livestock datasets

on:
  push:
    paths:
      - ".github/workflows/probe-eurostat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate dataset codes
        run: |
          base="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
          try () {
            code="$1"; extra="$2"
            url="${base}/${code}?format=JSON&lang=EN&${extra}"
            echo "==== ${code} (${extra})"
            out=$(curl -sS -m 40 -o resp.json -w "%{http_code}" "$url" || echo "err")
            echo "status: $out  size: $(wc -c < resp.json 2>/dev/null)"
            if [ "$out" = "200" ]; then
              python3 - <<'EOF'
          import json
          d = json.load(open("resp.json"))
          print("dims:", d.get("id"))
          for dim in d.get("id", []):
              cat = d["dimension"][dim]["category"]
              labels = cat.get("label", {})
              items = list(labels.items())[:12]
              print(f"  {dim}: {len(labels)} -> {items}")
          print("values:", len(d.get("value", {})))
          EOF
            else
              head -c 400 resp.json; echo
            fi
          }
          try tgs00045 "geo=ES41&sinceTimePeriod=2005"
          try ef_lsk_main "geo=ES41"
          try apro_mt_lssheep "geo=ES&sinceTimePeriod=2005"
          try apro_mt_lsgoat "geo=ES&sinceTimePeriod=2005"
          try agr_r_animal "geo=ES41"
